<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOW Agency CRM</title>

<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.cdnfonts.com/css/ethnocentric" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial, Helvetica, sans-serif;

background:
radial-gradient(circle at top right, rgba(255,106,0,.10), transparent 30%),
linear-gradient(180deg,#000000,#050505);

color:white;
}

body{
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{

width:100%;
max-width:430px;

background:#0b0b0b;

border:1px solid #1f1f1f;

border-radius:28px;

padding:42px 32px;

position:relative;

box-shadow:
0 0 30px rgba(0,0,0,.55);

}

.logo{
width:115px;
display:block;
margin:auto;
margin-bottom:26px;
}

h1{

font-family:'Ethnocentric', sans-serif;

text-align:center;

font-size:30px;

margin-bottom:10px;

line-height:1.4;
}

.now{
color:#ff6a00;
}

.white{
color:#ffffff;
}

.subtitle{
text-align:center;
font-size:14px;
color:#8f8f8f;
margin-bottom:35px;
}

label{
display:block;
margin-bottom:10px;
margin-top:20px;
font-size:14px;
font-weight:bold;
color:#ff8c2b;
}

input{

width:100%;

padding:16px;

border-radius:14px;

border:1px solid #222;

background:#111111;

color:white;

font-size:15px;

outline:none;

transition:.2s;
}

input:focus{

border-color:#ff6a00;

background:#141414;

}

button{

width:100%;

padding:16px;

margin-top:30px;

border:none;

border-radius:15px;

background:#1c1c1c;

border:1px solid rgba(255,106,0,.18);

color:#ff6a00;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s;
}

button:hover{

background:#ff6a00;

color:white;

}

.error{

margin-top:18px;

text-align:center;

color:#ff5757;

font-size:14px;

font-weight:bold;
}

.users{

margin-top:30px;

background:#111111;

border:1px solid #1f1f1f;

border-radius:16px;

padding:18px;

font-size:13px;

line-height:1.8;

color:#bdbdbd;
}

.users strong{
color:#ff8c2b;
}

.footer{

margin-top:24px;

text-align:center;

font-size:12px;

color:#666;
}

@media(max-width:480px){

.login-box{
padding:30px 24px;
border-radius:22px;
}

h1{
font-size:23px;
}

.logo{
width:90px;
}

input{
padding:15px;
}

button{
padding:15px;
}

}

</style>
</head>

<body>

<div class="login-box">

<img src="assets/now-logo.png" class="logo">

<h1>
<span class="now">NOW</span>
<span class="white">Agency CRM</span>
</h1>

<div class="subtitle">
Creative Agency Management System
</div>

<label>Usuario</label>

<input
type="text"
id="user"
placeholder="Ingresa tu usuario"
autocomplete="username"
>

<label>Contraseña</label>

<input
type="password"
id="pass"
placeholder="Ingresa tu contraseña"
autocomplete="current-password"
>

<button onclick="login()">
Entrar al CRM
</button>

<div class="error" id="error"></div>

<div class="users">

<strong>Usuarios demo</strong>

<br><br>

facunow / now123

<br>

panchonow / now123456

</div>

<div class="footer">
NOW Agency CRM · Beta Professional
</div>

</div>

<script>

function login(){

const user =
document.getElementById('user')
.value
.trim();

const pass =
document.getElementById('pass')
.value
.trim();

if(
user === "facunow"
&&
pass === "now123"
){

localStorage.setItem(
"now_user",
"facunow"
);

window.location.href =
"/dashboard.html";

return;
}

if(
user === "panchonow"
&&
pass === "now123456"
){

localStorage.setItem(
"now_user",
"panchonow"
);

window.location.href =
"/dashboard.html";

return;
}

document.getElementById('error')
.innerHTML =
"Usuario o contraseña incorrectos";

}

</script>

</body>
</html>
