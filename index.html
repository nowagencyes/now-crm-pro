<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOW CRM Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050505;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow:hidden;
}

body::before{
content:'';
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#ff6a00 0%,transparent 70%);
opacity:.25;
right:-200px;
top:-200px;
}

.login{
width:420px;
background:#111;
border:1px solid #2a2a2a;
padding:40px;
border-radius:24px;
position:relative;
z-index:10;
}

.logo{
width:100px;
display:block;
margin:auto;
margin-bottom:20px;
}

h1{
text-align:center;
margin-bottom:10px;
color:#ff6a00;
font-size:42px;
}

.subtitle{
text-align:center;
color:#aaa;
margin-bottom:30px;
}

label{
display:block;
margin-bottom:10px;
margin-top:20px;
font-weight:bold;
}

input{
width:100%;
padding:16px;
border-radius:14px;
border:1px solid #444;
background:#1a1a1a;
color:white;
font-size:16px;
}

button{
width:100%;
padding:16px;
margin-top:30px;
border:none;
border-radius:14px;
background:#ff6a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.02);
}

.error{
margin-top:15px;
text-align:center;
color:#ff4b4b;
font-weight:bold;
}

.demo{
margin-top:30px;
background:#1a1a1a;
padding:20px;
border-radius:16px;
text-align:center;
color:#aaa;
font-size:14px;
}

</style>

</head>

<body>

<div class="login">

<img src="assets/now-logo.png" class="logo">

<h1>NOW CRM</h1>

<div class="subtitle">
Creative Agency Management System
</div>

<label>Usuario</label>
<input type="text" id="user">

<label>Contraseña</label>
<input type="password" id="pass">

<button onclick="login()">
Entrar al CRM
</button>

<div class="error" id="error"></div>

</div>

<script>

function login(){

const user = document.getElementById('user').value;
const pass = document.getElementById('pass').value;

if(user === "facunow" && pass === "now123"){

window.location.href = "/dashboard.html";

}

else if(user === "panchonow" && pass === "now123456"){

window.location.href = "/dashboard.html";

}

else{

document.getElementById('error').innerHTML = "Usuario o contraseña incorrectos";

}

}

</script>

</body>
</html>
